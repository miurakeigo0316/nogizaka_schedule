name: Hinata News Bot

on:
  schedule:
    - cron: "0 3,15 * * *" # 12時間ごとに実行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # リポジトリへの書き込み権限を与える
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 line-bot-sdk webdriver-manager gspread

      - name: Run script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python hinata_line_news.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_title_hinata.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last_title_hinata.txt" && git push)

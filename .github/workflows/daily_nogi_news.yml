name: Nogizaka News Bot

on:
  schedule:
    - cron: "*/30 * * * *" # 30分おきにチェック
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: # リポジトリへの書き込み権限を与える
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          pip install selenium beautifulsoup4 line-bot-sdk webdriver-manager

      - name: Run script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python nogi_line_news.py

      - name: Commit and Push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add last_title.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update last_title.txt" && git push)
